<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massage Rinnovati</title>
  <style>
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: linear-gradient(to bottom right, #fdcfe1 60%, #edade0 100%);
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 30px auto;
      background: rgba(255,255,255,0.75);
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(187, 140, 189, 0.16);
      padding: 30px 40px;
      position: relative;
    }
    .titre {
      font-size: 44px;
      color: #377cf9;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .rabais {
      font-size: 21px;
      margin-bottom: 18px;
      color: #695252;
      font-weight: 600;
    }
    .services {
      margin: 22px 0;
      font-size: 18px;
      color: #4b3621;
      line-height: 1.7;
    }
    .services h3 {
      font-weight: 500;
      font-size: 20px;
      margin-bottom: 9px;
    }
    .img-group {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 8px;
    }
    .img-large {
      width: 45%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      border: 8px solid #c1adc6;
      box-shadow: 0 1px 8px rgba(61, 53, 111, 0.09);
    }
    .img-small {
      width: 28%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #e9d1f3;
      box-shadow: 0 1px 8px rgba(61, 53, 111, 0.09);
    }
    .img-coin {
      position: absolute;
      top: -55px;
      right: -65px;
      width: 270px;
      border-radius: 0 0 75px 0;
      z-index: 1;
    }
    .commander {
      font-size: 19px;
      margin-top: 34px;
      color: #313030;
      font-weight: 500;
    }
    .coordonnees {
      margin: 5px 0 25px 0;
      color: #403b3b;
      font-size: 17px;
      line-height: 1.5;
    }
    @media (max-width: 700px) {
      .container {
        padding: 15px 5px;
        max-width: 99%;
      }
      .img-coin {
        width: 140px;
        top: -25px;
        right: -20px;
      }
      .img-large, .img-small {
        width: 45vw;
        min-width: 35vw;
        max-width: 70vw;
      }
      .img-group {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="coin.jpg" class="img-coin" alt="Massage décoratif" />
    <div class="titre">MASSAGE<br>RINNOVATI</div>
    <div class="rabais">RABAIS AUTOMNE 15%</div>
    <div class="services">
      <h3>NOS SERVICES</h3>
      <hr style="border: none; border-top: 1px solid #3e2d24; width: 170px; margin-left: 0;">
      <ul>
        <li>Massage table</li>
        <li>Massage chaise</li>
        <li>Masque visage</li>
      </ul>
    </div>
    <div class="img-group">
      <img src="main-visage.png" class="img-large" alt="Massage visage">
      <img src="main-table.png" class="img-small" alt="Massage table">
      <img src="main-dos.png" class="img-small" alt="Massage dos">
    </div>
    <div class="commander">COMMANDER</div>
    <div class="coordonnees">
      +123-456-7890<br>
      www.reallygreatsite.com<br>
      123 Anywhere St., Any City
    </div>
  </div>
</body>
</html>
